<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f3">
<meta name="description" content="클라이언트 — 설치 파일 다운로드와 기능 표 (코드에서 자동 생성, 실시간 갱신)">
<title>클라이언트 · seungjaehh</title>
<link rel="stylesheet" href="../assets/ds.css">
<style>
.hero{display:grid;gap:var(--s-4)}
.dlrow{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
h1 small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.bar{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;margin:var(--s-6) 0 var(--s-3)}
.bar .field{flex:1;min-width:200px}
.table td.n code{font-size:12.5px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.badge.new{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.chg{background:var(--brand-soft);color:var(--brand)}
tr.flash td{animation:flash 2.6s ease-out}
@keyframes flash{from{background:var(--brand-soft)}to{background:transparent}}
.log{margin-top:var(--s-5)}
.log ul{margin:var(--s-2) 0 0;padding:0;list-style:none;font-size:13px}
.log li{display:flex;gap:var(--s-3);padding:4px 0;color:var(--muted)}.log li time{min-width:118px}.log li b{color:var(--ink)}
.empty-row{padding:var(--s-6);text-align:center;color:var(--muted)}
.pill.stale{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
@media(max-width:720px){.log li{flex-direction:column;gap:0}}
</style>
</head>
<body>
<header class="topbar"><div class="container">
  <a class="back" href="../">← 모음집</a>
  <span class="grow"></span>
  <span class="pill pill-ok pill-live" id="live"><span id="liveText">불러오는 중…</span></span>
  <button class="btn btn-quiet btn-sm" type="button" data-theme-toggle>자동</button>
</div></header>
<main class="container">
  <div class="page-head hero">
    <h1 id="title">클라이언트 <small id="ver"></small></h1>
    <p id="sub">코드에서 자동 생성되는 기능 표 — 기능이 추가·변경되면 이 표도 저절로 바뀝니다.</p>
    <div class="dlrow"><a class="btn btn-primary btn-lg" id="dl" hidden></a><span class="muted small" id="dlnote">설치 파일 준비 중</span></div>
    <div class="stats" id="chips"></div>
  </div>
  <div class="bar">
    <div class="chips" id="seg" role="group" aria-label="종류 필터"></div>
    <input id="q" class="field" data-search type="search" placeholder="기능·설명 검색  ( / )" autocomplete="off" spellcheck="false" aria-label="검색">
  </div>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>종류</th><th>분류</th><th>기능</th><th>설명</th><th>위치</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="card card-pad-sm log" id="logBox" hidden><h3>최근 변경</h3><ul id="log"></ul></div>
  <p class="footer">공통 디자인 규칙: <a href="../ds/">디자인 가이드</a></p>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="../assets/ds.js"></script>
<script>
const $ = s => document.querySelector(s)
const KINDS = ['전체', '화면', '구성요소', '도구', 'API']
const WEEK = 7 * 24 * 3600 * 1000
let data = null, kind = '전체', lastOkAt = 0
let seen = new Set()

const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n }
const ago = ts => { const s = Math.max(0, (Date.now() - ts) / 1000); return s < 60 ? '방금' : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전` }

function renderSeg() {
  const seg = $('#seg'); seg.replaceChildren()
  for (const k of KINDS) {
    const b = mk('button', 'chip', k); b.type = 'button'; b.setAttribute('aria-pressed', String(k === kind))
    b.onclick = () => { kind = k; renderSeg(); renderRows() }
    seg.append(b)
  }
}

function renderChips() {
  const c = data.counts, box = $('#chips'); box.replaceChildren()
  for (const [label, n] of [['화면', c.screens], ['도구', c.tools], ['API', c.api], ['전체 기능', c.total]]) {
    const d = mk('div', 'stat'); d.append(mk('b', null, String(n)), mk('span', null, label)); box.append(d)
  }
}

function renderRows(flashIds = new Set()) {
  const q = $('#q').value.trim().toLowerCase(), body = $('#rows'); body.replaceChildren()
  const rows = data.features.filter(r => (kind === '전체' || r.kind === kind) && (!q || `${r.name} ${r.description} ${r.category} ${r.where}`.toLowerCase().includes(q)))
  if (!rows.length) { const tr = mk('tr'), td = mk('td', 'empty-row', '해당하는 기능 없음'); td.colSpan = 5; tr.append(td); body.append(tr); return }
  for (const r of rows) {
    const tr = mk('tr', flashIds.has(r.id) ? 'flash' : ''), name = mk('td', 'n'); name.dataset.area = 'name'
    name.append(r.kind === 'API' ? mk('code', null, r.name) : document.createTextNode(r.name))
    if (r.firstSeen && Date.now() - Date.parse(r.firstSeen) < WEEK) name.append(mk('span', 'badge new', 'NEW'))
    else if (r.changedAt && Date.now() - Date.parse(r.changedAt) < WEEK) name.append(mk('span', 'badge chg', '변경'))
    const kd = mk('td'); kd.dataset.area = 'kind'; kd.append(mk('span', 'tag', r.kind))
    const cat = mk('td', null, r.category); cat.dataset.area = 'cat'
    const desc = mk('td', 'd', r.description || '—'); desc.dataset.area = 'desc'
    const where = mk('td', 'w', r.where); where.dataset.area = 'where'
    tr.append(kd, cat, name, desc, where)
    body.append(tr)
  }
}

function renderLog() {
  const list = $('#log'); list.replaceChildren()
  const items = (data.changeLog ?? []).slice(0, 12)
  $('#logBox').hidden = !items.length
  for (const c of items) {
    const li = mk('li'), t = mk('time', null, new Date(c.at).toLocaleString('ko-KR', { hour12: false }))
    li.append(t, mk('b', null, c.type), document.createTextNode(c.name)); list.append(li)
  }
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3800) }

function renderLive() {
  const stale = Date.now() - lastOkAt > 150_000
  $('#live').className = 'pill pill-live ' + (stale ? 'pill-warn' : 'pill-ok')
  $('#liveText').textContent = stale ? '연결 확인 중…' : `실시간 · 코드 기준 ${ago(Date.parse(data.generatedAt))} 갱신`
}

async function load(first) {
  try {
    const res = await fetch(`features.json?t=${Date.now()}`, { cache: 'no-store' })
    if (!res.ok) throw new Error(res.status)
    const next = await res.json()
    lastOkAt = Date.now()
    const changed = !data || next.contentHash !== data.contentHash
    const flash = new Set()
    if (data && changed) {
      const before = new Map(data.features.map(f => [f.id, f.description + f.name]))
      for (const f of next.features) if (!before.has(f.id) || before.get(f.id) !== f.description + f.name) flash.add(f.id)
    }
    data = next
    if (changed) {
      $('#ver').textContent = `v${data.version}`
      renderChips(); renderRows(flash); renderLog()
      if (!first && flash.size) toast(`기능표가 갱신됐어요 — ${flash.size}개 추가/변경`)
      else if (!first) toast('기능표가 갱신됐어요')
    }
    renderLive()
  } catch { if (data) renderLive(); else $('#liveText').textContent = '불러오기 실패 — 잠시 후 다시 시도' }
}

async function loadRelease() {
  try {
    const res = await fetch('https://api.github.com/repos/seungjaehh/seungjaehh.github.io/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
    if (!res.ok) throw new Error(res.status)
    const rel = await res.json()
    const exe = (rel.assets || []).find(a => a.name.endsWith('.exe'))
    if (!exe) throw new Error('no exe')
    const a = $('#dl')
    a.href = exe.browser_download_url
    a.replaceChildren(document.createTextNode('Windows 다운로드 '), mk('small', null, `${rel.tag_name.replace(/^client-/, '')} · ${Math.round(exe.size / 1048576)}MB`))
    a.hidden = false; $('#dlnote').textContent = '설치 후 설정 탭에서 서버 주소와 토큰을 입력하세요'
  } catch { /* no release yet: keep the placeholder */ }
}

renderSeg()
loadRelease()
$('#q').addEventListener('input', () => data && renderRows())
load(true)
setInterval(load, 30_000)
setInterval(() => data && renderLive(), 15_000)
</script>
</body>
</html>

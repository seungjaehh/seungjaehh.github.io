<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seungjaehh · Projects</title>
<style>
  :root{
    --bg:#f7f7f8;
    --card-bg:#ffffff;
    --text:#1a1a1e;
    --muted:#6b6b76;
    --border:#e4e4e9;
    --accent:#3b6bff;
    --chip-bg:#eef1ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121214;
      --card-bg:#1b1b1f;
      --text:#f1f1f4;
      --muted:#9a9aa5;
      --border:#2c2c33;
      --accent:#7d9dff;
      --chip-bg:#22243a;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:48px 20px 80px;
  }
  main{
    max-width:820px;
    margin:0 auto;
  }
  header{
    margin-bottom:40px;
  }
  header h1{
    font-size:28px;
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
  }
  .links{
    margin-top:16px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .links a{
    color:var(--accent);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
  }
  .links a:hover{text-decoration:underline;}
  section h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0 0 16px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
  }
  .card h3{
    margin:0;
    font-size:17px;
  }
  .card p{
    margin:0;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.55;
    flex:1;
  }
  .chip{
    display:inline-block;
    align-self:flex-start;
    background:var(--chip-bg);
    color:var(--accent);
    font-size:12px;
    font-weight:600;
    padding:3px 10px;
    border-radius:999px;
  }
  footer{
    margin-top:60px;
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>seungjaehh</h1>
    <p>GitHub에 올린 프로젝트 모음입니다.</p>
    <div class="links">
      <a href="https://github.com/seungjaehh" target="_blank" rel="noopener">GitHub 프로필 ↗</a>
    </div>
  </header>

  <section>
    <h2>Projects</h2>
    <div class="grid">
      <a class="card" href="https://seungjaehh.github.io/exam-answers/">
        <span class="chip">JavaScript</span>
        <h3>답모아</h3>
        <p>고3 국어·영어 모의고사 및 수능 정답 보관함</p>
      </a>
    </div>
  </section>

  <footer>
    © 2026 seungjaehh
  </footer>
</main>
</body>
</html>

  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}a{color:inherit;text-decoration:none}button,input{font:inherit}a:focus-visible,input:focus-visible{outline:3px solid #ee963b;outline-offset:3px}::selection{background:#ccdcff;color:#17243a}.wrap{width:min(1080px,calc(100% - 64px));margin:auto}.skip{position:fixed;left:18px;top:-80px;z-index:10;padding:11px 16px;background:var(--ink);color:#fff;border-radius:8px}.skip:focus{top:12px}
    header{padding:42px 0 30px;border-bottom:1px solid var(--line)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:24px}.name{font-size:28px;font-weight:760;letter-spacing:-1px;line-height:1}.github{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--muted);font-size:14px;font-weight:600}.github:hover{color:var(--blue)}.github svg{width:19px;height:19px}.search{position:relative;margin-top:28px}.search svg{position:absolute;left:17px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:#8491a5;pointer-events:none}.search input{width:100%;height:58px;border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);padding:0 48px;font-size:16px;box-shadow:0 5px 20px #253c6510}.search input::placeholder{color:#8a96a9}.search input:focus{border-color:#8ea9e9}.clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font-size:19px}.clear:hover{background:var(--soft)}.clear[hidden]{display:none}
    main{padding:36px 0 70px}.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.list-head h1{font-size:14px;margin:0;letter-spacing:.3px}.count{font-size:13px;color:var(--muted)}.projects{display:grid;gap:18px}.project{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(360px,1.28fr);min-height:330px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 14px 40px -30px #192d50;transition:border-color .18s,transform .18s}.project:hover{border-color:#a8b9d7;transform:translateY(-2px)}.project-info{padding:34px;display:flex;flex-direction:column;align-items:flex-start}.project-type{font-size:12px;font-weight:650;color:var(--blue);background:var(--soft);padding:5px 9px;border-radius:6px}.project h2{font-size:36px;letter-spacing:-1.3px;line-height:1.2;margin:22px 0 0}.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:auto}.open{display:inline-flex;align-items:center;justify-content:space-between;gap:30px;min-width:160px;min-height:50px;padding:11px 18px;border-radius:9px;background:var(--blue);color:#fff;font-size:15px;font-weight:650}.open:hover{background:#204eba}.source{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);font-size:14px}.source:hover{color:var(--blue)}
    .project{display:block;min-height:0;border-radius:14px}.project-info{min-height:0;padding:22px 24px;flex-direction:row;align-items:center;gap:18px}.project h2{margin:0;font-size:24px;letter-spacing:-.6px}.actions{margin:0 0 0 auto}.open{min-height:44px;min-width:138px;padding:9px 15px}.empty{display:none;padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:7px}.projects.no-results+.empty{display:block}.project[hidden]{display:none}.footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:13px}
    @media(max-width:780px){.wrap{width:calc(100% - 40px)}header{padding-top:29px}.name{font-size:24px}.search{margin-top:22px}.search input{height:54px}.project:hover{transform:none}}
    @media(max-width:560px){.project-info{padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}.project h2{font-size:21px}.actions{grid-column:1/-1;width:100%;margin:2px 0 0;gap:12px}.open{flex:1;min-width:0}.source{padding:0 5px}}
    @media(max-width:390px){.wrap{width:calc(100% - 32px)}header{padding-bottom:24px}.name{font-size:22px}.github span{display:none}.search{margin-top:19px}.search input{font-size:15px}.project-info{padding:16px}.project h2{font-size:20px}.list-head{margin-bottom:12px}main{padding-top:29px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.project,.preview-window{transform:none!important}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101824;--paper:#172334;--ink:#edf2fb;--muted:#a7b4c9;--line:#2d3d52;--blue:#4c79e8;--soft:#253752}.project-type{color:#bdd0ff}.open{background:#3564d1}.open:hover{background:#4272df}.preview-window{color-scheme:light}.github:hover,.source:hover{color:#a8c1ff}}
  </style>

<body>

      <div class="projects">

  <script>
    const search = document.querySelector('#project-search');
    const clear = document.querySelector('.clear');
    const projects = document.querySelector('.projects');
    const cards = [...document.querySelectorAll('.project')];
    const count = document.querySelector('.count');
    function filterProjects(){const query=search.value.trim().toLocaleLowerCase('ko');let visible=0;for(const card of cards){const match=!query||card.dataset.search.toLocaleLowerCase('ko').includes(query);card.hidden=!match;if(match)visible++}projects.classList.toggle('no-results',visible===0);count.textContent=visible+'개';clear.hidden=!search.value}
    search.addEventListener('input',filterProjects);
    clear.addEventListener('click',()=>{search.value='';filterProjects();search.focus()});
  </script>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f4">
  <meta name="description" content="seungjaehh의 페이지·프로젝트 모음">
  <title>페이지·프로젝트 모음 · seungjaehh</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23152133'/%3E%3Cpath d='M12 14h16M12 20h10M12 26h16' stroke='%239ebcff' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/ds.css">
  <style>
    .list{list-style:none;margin:0;padding:0;display:grid;gap:var(--s-2)}
    .item{position:relative;display:flex;align-items:center;gap:var(--s-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:var(--s-4) var(--s-5);transition:border-color .15s,box-shadow .15s}
    .item:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line));box-shadow:var(--shadow)}
    .item[hidden]{display:none}
    .item-main{flex:1;min-width:0;color:inherit;text-decoration:none;display:grid;gap:2px}
    .item-main::after{content:"";position:absolute;inset:0;border-radius:inherit} /* whole card is the tap target */
    .item-title{display:flex;align-items:center;gap:var(--s-2)}
    .item-title b{font-size:17px;letter-spacing:-.02em}
    .item-desc{color:var(--ink-2);font-size:14px}
    .item-side{display:flex;align-items:center;gap:var(--s-2)}
    .item-side .btn-quiet{position:relative;z-index:2}
    .item-go{pointer-events:none}
    .item:hover .item-go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .search-wrap{margin-top:var(--s-5)}
    .empty{display:none;text-align:center;padding:var(--s-7) 0;color:var(--muted)}
    @media(max-width:600px){
      .item{flex-wrap:wrap;padding:var(--s-4)}
      .item-side{width:100%}
      .item-go{flex:1}
      .item-side .btn-quiet{order:2;min-width:88px}
      .item-side.no-gh::after{content:"";min-width:88px;order:2}
    }
  </style>
</head>
<body>
  <a class="skip" href="#projects">프로젝트 목록으로 이동</a>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="./">seungjaehh</a>
      <span class="grow"></span>
      <a class="btn btn-quiet btn-sm" href="https://github.com/seungjaehh" target="_blank" rel="noopener noreferrer" aria-label="seungjaehh GitHub 프로필, 새 탭">GitHub ↗</a>
      <button class="btn btn-quiet btn-sm" type="button" data-theme-toggle>자동</button>
    </div>
  </header>
  <main class="container" id="projects">
    <div class="page-head">
      <h1>페이지·프로젝트 모음</h1>
      <p>만든 것들을 한곳에. 카드를 누르면 바로 열려요.</p>
      <div class="search-wrap"><input class="field" data-search type="search" placeholder="검색  ( / 키로 이동 )" aria-label="프로젝트 검색" autocomplete="off" spellcheck="false"></div>
    </div>
      <section class="section" data-group>
        <h2>서비스</h2>
        <ul class="list">
          <li class="item" data-search="국제관계 분석 국가 뉴스 외교 안보 경제">
            <a class="item-main" href="./country-relation-analyzer/" aria-label="국제관계 분석 열기">
              <span class="item-title"><b>국제관계 분석</b><span class="tag">WEB</span></span>
              <span class="item-desc">국가별 뉴스로 외교·안보·경제 흐름을 읽는 분석 도구</span>
            </a>
            <span class="item-side no-gh"><span class="btn btn-fixed item-go" aria-hidden="true">열기</span></span>
          </li>
        </ul>
      </section>
    <p class="empty" id="empty">검색 결과가 없어요</p>
  </main>
  <script src="./assets/ds.js"></script>
  <script>
    (() => {
      const q = document.querySelector('[data-search]'), items = [...document.querySelectorAll('.item')]
      const groups = [...document.querySelectorAll('[data-group]')], empty = document.getElementById('empty')
      q.addEventListener('input', () => {
        const v = q.value.trim().toLowerCase()
        items.forEach(i => i.hidden = !!v && !(i.dataset.search + ' ' + i.textContent).toLowerCase().includes(v))
        groups.forEach(g => g.hidden = !g.querySelector('.item:not([hidden])'))
        empty.style.display = groups.every(g => g.hidden) ? 'block' : 'none'
      })
    })()
  </script>
</body>
</html>

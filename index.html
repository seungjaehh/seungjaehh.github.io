    main{padding:36px 0 70px}.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.list-head h1{font-size:14px;margin:0;letter-spacing:.3px}.count{font-size:13px;color:var(--muted)}.projects{display:grid;gap:14px}.project{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(360px,1.28fr);min-height:330px;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 14px 40px -30px #0005;transition:border-color .18s,transform .18s}.project:hover{border-color:#999;transform:translateY(-2px)}.project-info{padding:34px;display:flex;flex-direction:column;align-items:flex-start}.project-type{font-size:11px;font-weight:650;color:var(--ink);background:var(--soft);padding:5px 9px;border-radius:6px}.project h2{font-size:36px;letter-spacing:-1.3px;line-height:1.2;margin:22px 0 0}.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:auto}.open{display:inline-flex;align-items:center;justify-content:space-between;gap:30px;min-width:160px;min-height:50px;padding:11px 18px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:650}.open:hover{background:#333}.source{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);font-size:13px}.source:hover{color:var(--ink)}
    .project{display:block;min-height:0;border-radius:12px}.project-info{min-height:0;padding:20px 22px;flex-direction:row;align-items:center;gap:16px}.project h2{margin:0;font-size:22px;letter-spacing:-.5px}.actions{margin:0 0 0 auto}.open{min-height:42px;min-width:132px;padding:8px 14px}.empty{display:none;padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:7px}.projects.no-results+.empty{display:block}.project[hidden]{display:none}.footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:12px}
    @media(max-width:780px){.wrap{width:calc(100% - 40px)}header{padding-top:29px}.name{font-size:24px}.search{margin-top:22px}.search input{height:54px}.project:hover{transform:none}}

  <script>
    const search = document.querySelector('#project-search');
    const clear = document.querySelector('.clear');
    const projects = document.querySelector('.projects');
    const cards = [...document.querySelectorAll('.project')];
    const count = document.querySelector('.count');
    function filterProjects(){const query=search.value.trim().toLocaleLowerCase('ko');let visible=0;for(const card of cards){const match=!query||card.dataset.search.toLocaleLowerCase('ko').includes(query);card.hidden=!match;if(match)visible++}projects.classList.toggle('no-results',visible===0);count.textContent=visible+'개';clear.hidden=!search.value}
    search.addEventListener('input',filterProjects);
    clear.addEventListener('click',()=>{search.value='';filterProjects();search.focus()});
  </script>

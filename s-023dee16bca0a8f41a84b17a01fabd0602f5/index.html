<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)">
<title>Skyworks · 진행 상황</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23152133'/%3E%3Cpath d='M8 26c4-10 8-14 12-14s8 4 12 14' stroke='%239ebcff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f5f5f3;--paper:#fff;--ink:#111;--muted:#707070;--line:#dededb;--soft:#efefec;
--ok:#1a7f4b;--okbg:#e6f4ec;--warn:#9a6b00;--warnbg:#fbf1dc;--bad:#b3261e;--badbg:#fbe9e7}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#080808;--paper:#151515;--ink:#f4f4f2;--muted:#aaa;--line:#303030;--soft:#242424;
--ok:#5fd394;--okbg:#12291d;--warn:#e0b558;--warnbg:#2a2113;--bad:#ff8a80;--badbg:#2c1614}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
a{color:inherit}
.wrap{width:min(720px,calc(100% - 32px));margin:auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
header{padding:26px 0 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:20px;font-weight:760;letter-spacing:-.6px;margin:0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.stale{background:var(--warn)}.dot.err{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.dot.beat{animation:pulse 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.dot.beat{animation:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.label{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:0 0 7px}
.big{font-size:17px;font-weight:600;margin:0;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
ol.steps li:first-child{border-top:0}
.mark{flex:none;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px;
background:var(--soft);color:var(--muted)}
li.done .mark{background:var(--okbg);color:var(--ok)}
li.now .mark{background:var(--ink);color:var(--paper)}
li.review .mark{background:var(--warnbg);color:var(--warn)}
li.done .txt{color:var(--muted)}
li.now .txt{font-weight:650}
li.review .txt{font-weight:650}
.hint{display:block;font-size:12.5px;font-weight:400;color:var(--warn);margin-top:3px;line-height:1.4}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-size:22px;font-weight:720;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
.err-box{display:none;background:var(--badbg);color:var(--bad);border-radius:12px;padding:14px;margin-top:14px;font-size:14px}
.skel{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skyworks</h1>
    <span class="live"><span class="dot beat" id="dot"></span><span id="ago">불러오는 중</span></span>
  </header>

  <div class="err-box" id="err"></div>

  <div class="card">
    <div class="row">
      <p class="label">지금 하는 일</p>
      <span class="pill warn" id="state">—</span>
    </div>
    <p class="big skel" id="note">불러오는 중…</p>
  </div>

  <div class="card">
    <p class="label">다음</p>
    <p class="big skel" id="next">—</p>
  </div>

  <div class="grid" style="margin-top:14px">
    <div class="stat"><p class="label">검증</p><div class="n" id="verify-n">—</div><div class="mono" id="verify-t"></div></div>
    <div class="stat"><p class="label">테스트</p><div class="n" id="tests">—</div><div class="mono">통과</div></div>
  </div>

  <div class="card">
    <div class="row"><p class="label" id="ms-label">진행</p><span class="mono" id="ms-count"></span></div>
    <ol class="steps" id="steps"><li class="skel">불러오는 중…</li></ol>
    <div class="bar"><i id="bar" style="width:0"></i></div>
  </div>

  <div class="card">
    <p class="label">마지막 커밋</p>
    <p class="mono" id="commit">—</p>
  </div>

  <footer>30초마다 자동 갱신 · <span id="updated">—</span></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const REFRESH = 30000;
let failures = 0, last = null;

function ago(iso){
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return '방금 전';
  if (s < 3600) return Math.floor(s/60) + '분 전';
  if (s < 86400) return Math.floor(s/3600) + '시간 전';
  return Math.floor(s/86400) + '일 전';
}

function setState(el, text, kind){ el.textContent = text; el.className = 'pill ' + kind; }

function render(d){
  last = d;
  $('note').textContent = d.note || '—';
  $('note').classList.remove('skel');
  $('next').textContent = d.next || '(지정 안 됨)';
  $('next').classList.remove('skel');
  $('commit').textContent = d.commit || '—';

  const label = { progress:'진행 중', done:'단위 완료', blocked:'차단됨' }[d.state] || d.state || '—';
  setState($('state'), label, d.state === 'blocked' ? 'bad' : d.state === 'done' ? 'ok' : 'warn');

  const pass = (d.verify || '').startsWith('PASS');
  const skip = (d.verify || '').startsWith('SKIP');
  $('verify-n').textContent = pass ? 'PASS' : skip ? 'SKIP' : 'FAIL';
  $('verify-n').style.color = pass ? 'var(--ok)' : skip ? 'var(--muted)' : 'var(--bad)';
  $('verify-t').textContent = pass ? '컴파일·테스트·빌드' : (d.verify || '').slice(0, 60);
  $('tests').textContent = d.tests != null ? d.tests : '—';

  const steps = d.milestone && d.milestone.steps || [];
  $('ms-label').textContent = (d.milestone && d.milestone.current || '진행');
  const doneN = steps.filter(s => s.status === 'done').length;
  $('ms-count').textContent = steps.length ? doneN + ' / ' + steps.length : '';
  $('bar').style.width = steps.length ? (doneN / steps.length * 100) + '%' : '0';
  $('steps').innerHTML = '';
  for (const s of steps){
    const li = document.createElement('li');
    li.className = ['done','now','review'].includes(s.status) ? s.status : '';
    const m = document.createElement('span');
    m.className = 'mark';
    m.textContent = s.status === 'done' ? '✓' : s.status === 'review' ? '!' : (steps.indexOf(s) + 1);
    const t = document.createElement('span');
    t.className = 'txt';
    t.textContent = s.title;
    if (s.hint){
      const h = document.createElement('span');
      h.className = 'hint';
      h.textContent = s.hint;
      t.append(h);
    }
    li.append(m, t);
    $('steps').append(li);
  }
  if (!steps.length) $('steps').innerHTML = '<li class="skel">단계 정보 없음</li>';

  $('updated').textContent = new Date(d.updated).toLocaleString('ko-KR');
  tick();
}

function tick(){
  if (!last) return;
  const mins = (Date.now() - new Date(last.updated)) / 60000;
  $('ago').textContent = ago(last.updated);
  const dot = $('dot');
  dot.className = 'dot beat' + (mins > 90 ? ' stale' : '');
}

async function load(){
  try {
    const r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
    failures = 0;
    $('err').style.display = 'none';
  } catch (e) {
    failures++;
    if (failures >= 2){
      $('dot').className = 'dot err';
      $('ago').textContent = '연결 실패';
      $('err').style.display = 'block';
      $('err').textContent = '상태를 불러오지 못했습니다 (' + e.message + '). 자동으로 다시 시도합니다.';
    }
  }
}

load();
setInterval(load, REFRESH);
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
